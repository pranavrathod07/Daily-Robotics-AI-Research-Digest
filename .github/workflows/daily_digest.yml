name: Daily Robotics Paper Scraper

on:
  schedule:
    # Runs 3 times a day at 02:30, 08:30, 14:30 UTC (8:00 AM, 2:00 PM, 8:00 PM IST)
    - cron: '30 2 * * *'
    - cron: '30 8 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch: # Manual run trigger

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "pranavrathod07"
        git config --global user.email "pranavrathod1330@gmail.com"
        git add .
        git commit -m "Auto-Update: Robotics & AI Research Digest [skip ci]" || exit 0
        git push
